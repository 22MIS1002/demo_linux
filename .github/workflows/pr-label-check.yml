name: PR Label Check
 
on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      
permissions:
  contents: read          
  issues: write
  pull-requests: write
  
jobs:
  check-label:
    concurrency:          
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    
    uses: 22MIS1002/demo_devops/.github/workflows/pr-label-check.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      repo: ${{ github.event.repository.name }}
      owner: ${{ github.event.repository.owner.login }}
