name: PRTI Enforcement
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
  issue_comment:
    types:
      - created
      - edited
      - deleted

concurrency:
  group: prti-enforcement-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  call-prti-enforcement:
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    uses: 22MIS1002/demo_devops/.github/workflows/prti-enforcement-reusable.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
      # head_sha: ${{ github.event.pull_request.head.sha || github.event.after || '' }}
      target_owner: ${{ github.repository_owner }}
      target_repo: ${{ github.event.repository.name }}
      event_name: ${{ github.event_name }}
      event_action: ${{ github.event.action }}
      comment_id: ${{ github.event.comment.id || 0 }}
      comment_body: ${{ github.event.comment.body || '' }}
      comment_sender_login: ${{ github.event.comment.user.login || '' }}
      comment_sender_type: ${{ github.event.comment.user.type || '' }}
    secrets:
      PRTI_CROSS_REPO_TOKEN: ${{ secrets.PRTI_CROSS_REPO_TOKEN }}
